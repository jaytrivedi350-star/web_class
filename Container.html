<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Container</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>

<body>

    <!-- Bootstrap Container -->
    <div class="container">

        <h1 class="text-center mt-5">Bootstrap Container</h1>

        <p class="text-center">
            This is a Bootstrap container.
        </p>

        <div class="row">

            <div class="col-md-4">
                <div class="p-4 bg-primary text-white">
                    Column 1
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-4 bg-success text-white">
                    Column 2
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-4 bg-danger text-white">
                    Column 3
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>

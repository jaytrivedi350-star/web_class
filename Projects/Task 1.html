
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Example</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .section {
            padding: 40px 20px;
            margin-bottom: 20px;
        }

        .container-section {
            background-color: #cfe2ff;
        }

        .fluid-section {
            background-color: #d1e7dd;
        }
    </style>
</head>
<body>

    <!-- Section 1: Container -->
    <section class="section container-section">
        <div class="container">
            <h2>Container Section</h2>
            <p>
                This section uses the Bootstrap .container class.
                It has a responsive fixed maximum width at different
                screen sizes and is centered on the page.
            </p>
        </div>
    </section>

    <!-- Section 2: Container Fluid -->
    <section class="section fluid-section">
        <div class="container-fluid">
            <h2>Container Fluid Section</h2>
            <p>
                This section uses the Bootstrap .container-fluid class.
                It takes up 100% of the available viewport width.
            </p>
        </div>
    </section>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Column Layout</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .column-box {
            background-color: #cfe2ff;
            padding: 30px;
            text-align: center;
            border: 1px solid #0d6efd;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Four Column Layout</h2>

        <div class="row">
            <div class="col-lg-3">
                <div class="column-box">Column 1</div>
            </div>

            <div class="col-lg-3">
                <div class="column-box">Column 2</div>
            </div>

            <div class="col-lg-3">
                <div class="column-box">Column 3</div>
            </div>

            <div class="col-lg-3">
                <div class="column-box">Column 4</div>
            </div>
        </div>
    </div>

</body>
</html>

<html>
<head>
    <title>CSS Filter Example</title>
	
	<style>
	img {
	    width: 300px;
		filter: grayscale(100%);
		transition: 0.5s;
	}

    img:hover {
        filter: grayscale(0%) brightness(120%);
    }
  </style>
</head>


<body>

    <h2>CSS Filter Example</h2>
 
    <img src="618i28Zf0NL._UF1000,1000_QL80_.jpg" all="618i28Zf0NL._UF1000,1000_QL80_">
	
</body>
</html>

<html>
<head>
    <title>Student Registration Form</title>
</head>

<body bgcolor="sky blue">
<center>
    <h2>Student Registration Form</h2>

    <form>
        <label>Name</label>
        <input type="text" name="Name">
        <br><br>

        <label>Email</label>
        <input type="email" name="Email">
        <br><br>

        <label>Password</label>
        <input type="password" name="password">
        <br><br>

        <label>Age:</label>
        <input type="number" name="Age">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="Gender" value="Female"> Female
        <input type="radio" name="Gender" value="Male"> Male
        <br><br>

        <label>Course</label>
        <select name="Course">
            <option value="MCA">MCA</option>
            <option value="BCA">BCA</option>
            <option value="B.tech">B.Tech</option>
        </select>
        <br><br>

        <label>Address</label>
        <textarea name="Address"></textarea>
        <br><br>
		
		
        <br><input type="file"></br>
		<br><input type="button" value="Ok"></br>
		<br><input type="color"></br>
		<br><input type=date></br>
		<br><input type=time></br>
		<br><input type=number></br>
		<br>0<input type=range>100</br>
        <br><input type="submit" value="Submit"></br>
        <br><input type="reset" value="Reset"></br>
    </form>

</body>
</center>
</html>

<html>
<head>
    <title>CSS Filter Example</title>
	
	<style>
	img {
	    width: 700px;
		filter: grayscale(100%);
		transition: 0.5s;
	}

    img:hover {
        filter: grayscale(0%) brightness(120%);
    }
  </style>
</head>


<body>

    <h2>CSS Filter Example</h2>
 
    <img src="jonatan-pie-3l3RwQdHRHg-unsplash.jpg" all="jonatan-pie-3l3RwQdHRHg-unsplash">
	
</body>
</html>

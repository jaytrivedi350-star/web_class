<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    
    <style>
        body {
            background-color: #ffffff;
        }

        h1 {
            text-align: center;
            margin: 15px 0 20px;
            font-size: 24px;
            font-weight: bold;
        }

        h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .box {
            background-color: #0d6efd;
            color: white;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
        }

        .grid-row {
            margin-bottom: 18px;
        }

        /* Small gap between columns */
        .grid-row > div {
            padding-left: 7px;
            padding-right: 7px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">

        <!-- Heading -->
        <h1>Bootstrap Grid System</h1>


        <!-- ============================== -->
        <!-- 12 EQUAL COLUMNS -->
        <!-- ============================== -->

        <h3>12 Equal Columns</h3>

        <div class="row grid-row">

            <div class="col-1">
                <div class="box">1</div>
            </div>

            <div class="col-1">
                <div class="box">2</div>
            </div>

            <div class="col-1">
                <div class="box">3</div>
            </div>

            <div class="col-1">
                <div class="box">4</div>
            </div>

            <div class="col-1">
                <div class="box">5</div>
            </div>

            <div class="col-1">
                <div class="box">6</div>
            </div>

            <div class="col-1">
                <div class="box">7</div>
            </div>

            <div class="col-1">
                <div class="box">8</div>
            </div>

            <div class="col-1">
                <div class="box">9</div>
            </div>

            <div class="col-1">
                <div class="box">10</div>
            </div>

            <div class="col-1">
                <div class="box">11</div>
            </div>

            <div class="col-1">
                <div class="box">12</div>
            </div>

        </div>


        <!-- ============================== -->
        <!-- 2 COLUMNS -->
        <!-- ============================== -->

        <h3>2 Columns</h3>

        <div class="row grid-row">

            <div class="col-6">
                <div class="box">col-6</div>
            </div>

            <div class="col-6">
                <div class="box">col-6</div>
            </div>

        </div>


        <!-- ============================== -->
        <!-- 3 COLUMNS -->
        <!-- ============================== -->

        <h3>3 Columns</h3>

        <div class="row grid-row">

            <div class="col-4">
                <div class="box">col-4</div>
            </div>

            <div class="col-4">
                <div class="box">col-4</div>
            </div>

            <div class="col-4">
                <div class="box">col-4</div>
            </div>

        </div>


        <!-- ============================== -->
        <!-- 4 COLUMNS -->
        <!-- ============================== -->

        <h3>4 Columns</h3>

        <div class="row grid-row">

            <div class="col-3">
                <div class="box">col-3</div>
            </div>

            <div class="col-3">
                <div class="box">col-3</div>
            </div>

            <div class="col-3">
                <div class="box">col-3</div>
            </div>

            <div class="col-3">
                <div class="box">col-3</div>
            </div>

        </div>


        <!-- ============================== -->
        <!-- RESPONSIVE GRID -->
        <!-- ============================== -->

        <h3>Responsive Grid</h3>

        <div class="row grid-row">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="box">Responsive 1</div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="box">Responsive 2</div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="box">Responsive 3</div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="box">Responsive 4</div>
            </div>

        </div>

    </div>

</body>
</html>
</html>
